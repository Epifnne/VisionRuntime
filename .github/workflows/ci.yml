name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Bootstrap dependencies
        run: >-
          cmake
          -DGIT_EXECUTABLE=git
          -DTHIRDPARTY_DIRECTORY="${{ github.workspace }}/Thirdparty"
          -P cmake/bootstrapDependencies.cmake
      - name: Configure
        run: cmake --preset windows-msvc-ci-debug -DVISION_BUILD_SERVICE=ON -DVISION_BUILD_SAMPLES=ON
      - name: Build
        run: cmake --build --preset windows-msvc-ci-debug
      - name: Test
        run: ctest --preset windows-msvc-ci-debug

  linux-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Bootstrap dependencies
        run: >-
          cmake
          -DGIT_EXECUTABLE=git
          -DTHIRDPARTY_DIRECTORY="${{ github.workspace }}/Thirdparty"
          -P cmake/bootstrapDependencies.cmake
      - name: Configure
        run: cmake --preset linux-gnu-debug -DVISION_BUILD_SERVICE=ON -DVISION_BUILD_SAMPLES=ON
      - name: Build
        run: cmake --build --preset linux-gnu-debug
      - name: Test
        run: ctest --preset linux-gnu-debug

  desktop-qt:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: [generic, businessExports, eventInspection]
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: win64_msvc2022_64
          cache: true
      - name: Bootstrap dependencies
        run: >-
          cmake -DGIT_EXECUTABLE=git
          -DTHIRDPARTY_DIRECTORY="${{ github.workspace }}/Thirdparty"
          -P cmake/bootstrapDependencies.cmake
      - name: Configure desktop
        shell: pwsh
        run: |
          $productOptions = @()
          if ('${{ matrix.product }}' -ne 'generic') {
            $productOptions += '-DVISION_PRODUCT_APPLICATION=${{ github.workspace }}/Samples/${{ matrix.product }}'
          }
          cmake -S . -B Build/Desktop-CI -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DVISION_CAMERA_SDK=NONE `
            -DVISION_BUILD_SERVICE=ON -DVISION_BUILD_SHELL=ON `
            -DVISION_BUILD_DESIGNER=ON @productOptions
      - name: Build desktop and tests
        run: cmake --build Build/Desktop-CI --parallel 4
      - name: Build desktop and design package
        shell: pwsh
        run: |
          if ('${{ matrix.product }}' -eq 'generic') {
            cmake --build Build/Desktop-CI --target publishShell publishDesigner --parallel 4
          } else {
            cmake --build Build/Desktop-CI --target publishSampleShell --parallel 4
          }
      - name: Test runtime, service, Shell and Designer contracts
        run: ctest --test-dir Build/Desktop-CI --output-on-failure --no-tests=error
